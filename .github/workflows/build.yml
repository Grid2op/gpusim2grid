# Level-1 CI: compile the CUDA extension (FP64 and FP32) with two toolchains on
# a free GitHub runner, taking everything from PyPI where PyPI has it:
#
# - CUDA 12.4 + cuDSS 1.x (nvidia-cudss-cu12). PyPI's CUDA 12 nvcc wheel has no
#   compiler driver (ptxas only), so this leg runs in the nvidia/cuda:12.4.1
#   "devel" image for nvcc and the CUDA libraries.
# - the latest CUDA 13 toolkit on PyPI (cuda-toolkit[nvcc,...], one prefix
#   <site-packages>/nvidia/cu13) + cuDSS 1.x (nvidia-cudss-cu13), on a plain
#   ubuntu22.04 image.
#
# lightsim2grid comes from PyPI too: its wheel (>= 1.3.1) ships
# lightsim2grid_core, its headers and the KLU headers the bridge needs.
#
# No GPU is needed to *build*. The pytest step then runs on that GPU-less
# machine: every test marked `requires_gpu` (conftest.py) is skipped, but all
# test modules are still imported and any pure-Python test still runs. The GPU
# tests themselves run in the opt-in `gpu-tests` job at the end, on Modal
# (ci/modal/gpu_tests.py), from the CUDA 13 / FP64 leg's wheel.
#
# CMAKE_CUDA_ARCHITECTURES is not pinned by the project; CI sets it to 75
# (the T4 of the gpu-tests job), so no device is needed to detect one.
#
# The cuDSS, lightsim2grid and CUDA 13 requirements below are the ones of
# pyproject.toml (dependencies, extras cuda12 / cuda13): keep them in sync.

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  VENV: /opt/venv
  LS2G_REQ: "lightsim2grid>=1.3.1"

jobs:
  # ---------------------------------------------------------------------------
  # Compile gpusim2grid in both precisions and run the (GPU-less) test suite.
  # ---------------------------------------------------------------------------
  build:
    name: build (CUDA ${{ matrix.cuda }}, ${{ matrix.precision }})
    runs-on: ubuntu-latest
    # Both images are ubuntu22.04 (Python 3.10): the CUDA 13 / FP64 wheel is
    # installed on Modal next to that Python.
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        cuda: ["12.4", "13"]
        precision: [fp64, fp32]
        include:
          - cuda: "12.4"
            image: nvidia/cuda:12.4.1-devel-ubuntu22.04
            cu: cu12
            cudss_req: "nvidia-cudss-cu12>=1.0.0.35,<2"
            cuda_req: ""
          - cuda: "13"
            image: ubuntu:22.04
            cu: cu13
            cudss_req: "nvidia-cudss-cu13>=1.0.0.35,<2"
            cuda_req: "cuda-toolkit[nvcc,crt,cudart,cccl,cublas,cusolver,cusparse,nvjitlink,nvvm]>=13,<14"
          - precision: fp64
            precision_env: CUDA_REAL_DOUBLE
            expect_fp32: "False"
          - precision: fp32
            precision_env: CUDA_REAL_FLOAT
            expect_fp32: "True"
    steps:
      - name: Install system packages
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            python3-pip python3-venv python3-dev git build-essential

      - uses: actions/checkout@v4

      - name: Set up Python environment
        env:
          CUDSS_REQ: ${{ matrix.cudss_req }}
          CUDA_REQ: ${{ matrix.cuda_req }}
        run: |
          python3 -m venv "$VENV"
          . "$VENV/bin/activate"
          pip install -q -U pip
          # cmake from PyPI: ubuntu22.04's 3.22 predates CUDA 13.
          pip install -q "$CUDSS_REQ" ${CUDA_REQ:+"$CUDA_REQ"} "$LS2G_REQ" \
            scikit-build-core pybind11 cmake numpy scipy pytest pandapower
          echo "$VENV/bin" >> "$GITHUB_PATH"
          # cuDSS (and, for CUDA 13, the whole toolkit) lives under
          # <site-packages>/nvidia/cuXX.
          root=$(python -c "import nvidia.${{ matrix.cu }} as m; print(list(m.__path__)[0])")
          echo "CUDSS_WHEEL_ROOT=$root" >> "$GITHUB_ENV"
          echo "NVIDIA_LIB=$root/lib" >> "$GITHUB_ENV"
          if [ -n "$CUDA_REQ" ]; then
            echo "CUDACXX=$root/bin/nvcc" >> "$GITHUB_ENV"
            echo "CUDAToolkit_ROOT=$root" >> "$GITHUB_ENV"
          fi
          pip list 2>/dev/null | grep -iE "^(nvidia|cuda|lightsim2grid|cmake)"

      - name: Build gpusim2grid (${{ matrix.precision }})
        env:
          # The cuDSS wheel ships no CMake config; ci/cmake/cudss provides one.
          cudss_DIR: ${{ github.workspace }}/ci/cmake/cudss
          # sm_75 = the T4 the gpu-tests job runs this leg's wheel on (a valid
          # target for both CUDA 12 and 13).
          CMAKE_ARGS: -DCMAKE_CUDA_ARCHITECTURES=75
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          export ${{ matrix.precision_env }}=1
          pip wheel -v --no-build-isolation --no-deps -w dist .
          pip install --no-deps dist/gpusim2grid-*.whl

      - name: Upload the wheel for the GPU tests
        if: matrix.cuda == '13' && matrix.precision == 'fp64'
        uses: actions/upload-artifact@v4
        with:
          name: gpusim2grid-wheel-cu13-fp64
          path: dist/gpusim2grid-*.whl
          retention-days: 1

      - name: Check the installed extension
        run: |
          export LD_LIBRARY_PATH="$NVIDIA_LIB:${LD_LIBRARY_PATH:-}"
          cd /
          python - <<'EOF'
          import gpusim2grid
          from gpusim2grid import _gpusim2grid as m
          print("gpusim2grid", gpusim2grid.__version__, "is_fp32 =", m.is_fp32)
          assert str(bool(m.is_fp32)) == "${{ matrix.expect_fp32 }}", "wrong precision"
          # The zero-copy lightsim2grid bridge is only compiled when
          # lightsim2grid_core is found; make sure it was.
          assert hasattr(m, "_make_ca_session_from_lsgrid"), "ls2g bridge not built"
          EOF

      - name: Run tests (GPU tests skip)
        run: |
          export LD_LIBRARY_PATH="$NVIDIA_LIB:${LD_LIBRARY_PATH:-}"
          pytest tests/python -m "not slow" -q -p no:cacheprovider

  # ---------------------------------------------------------------------------
  # Run the real GPU test suite on Modal (one leg: CUDA 13, FP64, T4), see
  # ci/modal/gpu_tests.py. Nothing is compiled there: the wheel built above is
  # installed into a cached image and only pytest runs on the GPU.
  # Opt-in, since it costs money: manual dispatch, pushes to main, and PRs
  # labelled `gpu-ci` (the label is read on the next push to the PR). Needs
  # the MODAL_TOKEN_ID / MODAL_TOKEN_SECRET secrets, which GitHub does not
  # expose to PRs from forks.
  # ---------------------------------------------------------------------------
  gpu-tests:
    name: gpu tests (Modal, CUDA 13, fp64, T4)
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      contains(github.event.pull_request.labels.*.name, 'gpu-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      G2G_PRECISION: fp64
      G2G_GPU: T4
      G2G_WHEELS: ${{ github.workspace }}/wheels
    steps:
      - name: Check Modal credentials
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::MODAL_TOKEN_ID / MODAL_TOKEN_SECRET secrets are not set"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Download the gpusim2grid wheel
        uses: actions/download-artifact@v4
        with:
          name: gpusim2grid-wheel-cu13-fp64
          path: wheels

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: pip install -q modal

      - name: Run GPU tests on Modal
        run: modal run ci/modal/gpu_tests.py
