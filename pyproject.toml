[build-system]
requires = ["scikit-build-core", "pybind11", "lightsim2grid>=1.3.1"]
build-backend = "scikit_build_core.build"

[project]
name = "gpusim2grid"
dynamic = ["version"]
authors = [
  { name = "DONNOT Benjamin", email = "benjamin.donnot@gmail.com" },
]
maintainers = [
  { name = "DONNOT Benjamin", email = "benjamin.donnot@gmail.com" },
]
description = "GPU-accelerated, batched AC power flow for the Grid2Op ecosystem"
readme = "README.md"
requires-python = ">=3.9"
license = "MPL-2.0"
classifiers = [
  "Development Status :: 3 - Alpha",

  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",

  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Environment :: GPU :: NVIDIA CUDA",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "numpy",
  "scipy",
  # >= 1.3.1: its wheel ships lightsim2grid_core, its headers and the KLU
  # headers the bridge compiles against, and the API the bridge uses.
  "lightsim2grid>=1.3.1",
]

[project.optional-dependencies]
test = [
  "pytest>=7",
  "pandapower",
  "lightsim2grid",
]
docs = [
  "sphinx>=7",
  "sphinx-rtd-theme>=2",
  "myst-parser>=2",
]
# The CUDA libraries and cuDSS from PyPI, for the CUDA major the extension was
# built with (also what .github/workflows/build.yml installs). Building with
# CUDA 13 also needs cuda-toolkit's nvcc, crt, cccl and nvvm; PyPI has no
# CUDA 12 compiler (see docs/installation.rst).
cuda12 = [
  "cuda-toolkit[cudart,cublas,cusolver,cusparse,nvjitlink]>=12.4,<13",
  "nvidia-cudss-cu12>=1.0.0.35",
  "nvidia-cudss-cu12<2",
]
cuda13 = [
  "cuda-toolkit[cudart,cublas,cusolver,cusparse,nvjitlink]>=13,<14",
  "nvidia-cudss-cu13>=1.0.0.35",
  "nvidia-cudss-cu13<2",
]
# gpusim2grid.differentiable (BatchPowerFlow / PowerFlowFunction) needs a
# CUDA-enabled PyTorch; everything else works without it.
torch = [
  "torch",
]

[project.urls]
Homepage = "https://github.com/Grid2Op/gpusim2grid"
Repository = "https://github.com/Grid2Op/gpusim2grid"
Issues = "https://github.com/Grid2Op/gpusim2grid/issues"

[tool.scikit-build]
wheel.packages = ["./src/gpusim2grid"]
wheel.expand-macos-universal-tags = true

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "./src/gpusim2grid/__init__.py"
regex = '''^__version__\s*=\s*"(?P<major>0|[1-9]\d*)\.(?P<minor>0|[1-9]\d*)\.(?P<patch>0|[1-9]\d*)(?:-(?P<prerelease>(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+(?P<buildmetadata>[0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?"$'''
result = "{major}.{minor}.{patch}.{prerelease}"
remove = '''\.None$'''
