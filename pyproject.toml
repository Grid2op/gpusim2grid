[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "gpusim2grid"
dynamic = ["version"]
authors = [
  { name = "DONNOT Benjamin", email = "benjamin.donnot@gmail.com" },
]
maintainers = [
  { name = "DONNOT Benjamin", email = "benjamin.donnot@gmail.com" },
]
description = "GPU-accelerated, batched AC power flow for the Grid2Op ecosystem"
readme = "README.md"
requires-python = ">=3.9"
license = "MPL-2.0"
classifiers = [
  "Development Status :: 3 - Alpha",

  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",

  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Environment :: GPU :: NVIDIA CUDA",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "numpy",
  "scipy",
  "lightsim2grid",
]

[project.optional-dependencies]
test = [
  "pytest>=7",
  "pandapower",
  "lightsim2grid",
]
docs = [
  "sphinx>=7",
  "sphinx-rtd-theme>=2",
  "myst-parser>=2",
]

[project.urls]
Homepage = "https://github.com/Grid2Op/gpusim2grid"
Repository = "https://github.com/Grid2Op/gpusim2grid"
Issues = "https://github.com/Grid2Op/gpusim2grid/issues"

[tool.scikit-build]
wheel.packages = ["./src/gpusim2grid"]
wheel.expand-macos-universal-tags = true

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "./src/gpusim2grid/__init__.py"
regex = '''^__version__\s*=\s*"(?P<major>0|[1-9]\d*)\.(?P<minor>0|[1-9]\d*)\.(?P<patch>0|[1-9]\d*)(?:-(?P<prerelease>(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+(?P<buildmetadata>[0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?"$'''
result = "{major}.{minor}.{patch}.{prerelease}"
