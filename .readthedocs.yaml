# Read the Docs configuration file.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

# The compiled CUDA extension cannot be built on Read the Docs (no GPU/CUDA
# toolchain). We install only the documentation dependencies; conf.py imports
# the package from ../src and mocks the extension.
python:
  install:
    - requirements: docs/requirements.txt
